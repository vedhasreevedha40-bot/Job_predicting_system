<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Edu2Job | Academic Profile</title>
</head>
<body class="bg-indigo-50 flex items-center justify-center min-h-screen p-6">
    <div class="bg-white p-10 rounded-3xl shadow-2xl max-w-lg w-full border border-indigo-100">
        <div class="flex items-center gap-4 mb-8">
            <a href="dashboard.html" class="text-indigo-600 hover:bg-indigo-50 p-2 rounded-full transition">←</a>
            <h2 class="text-2xl font-black text-indigo-900">Academic Profile</h2>
        </div>

        <form onsubmit="saveEducation(event)" class="space-y-5">
            <div>
                <label class="text-xs font-bold text-slate-400 uppercase ml-1">Current Branch</label>
                <input id="branch" type="text" placeholder="e.g., Computer Science" class="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none focus:border-indigo-600 transition" required>
            </div>

            <div>
                <label class="text-xs font-bold text-slate-400 uppercase ml-1">University</label>
                <input id="university" type="text" placeholder="e.g., University of Mumbai" class="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none focus:border-indigo-600 transition" required>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase ml-1">CGPA</label>
                    <input id="cgpa" type="number" step="0.01" placeholder="0.00" class="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none focus:border-indigo-600 transition" required>
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase ml-1">Graduation Year</label>
                    <input id="year" type="number" placeholder="2025" class="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none focus:border-indigo-600 transition" required>
                </div>
            </div>

            <button type="submit" id="saveBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-indigo-700 transition transform active:scale-95">
                SAVE PROFILE
            </button>
        
            <!-- Debug helper: shows current auth and stored profile in console -->
            <button type="button" onclick="debugProfile()" class="w-full mt-3 bg-slate-100 text-slate-700 py-3 rounded-2xl font-bold border border-slate-200 hover:bg-slate-200 transition">
                DEBUG: Show Current User & Profile (Console)
            </button>
        </form>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-indigo-50 flex items-center justify-center h-screen">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md">
        <h2 class="text-3xl font-black text-indigo-900 mb-2">Join Us</h2>
        <p class="text-slate-400 mb-8">Enter your details to create an account.</p>
        <form onsubmit="handleSignup(event)" class="space-y-4">
            <input type="email" id="signupEmail" placeholder="Email Address" class="w-full p-4 border-2 border-slate-100 rounded-xl outline-none focus:border-indigo-600" required>
            <input type="password" id="signupPassword" placeholder="Create Password" class="w-full p-4 border-2 border-slate-100 rounded-xl outline-none focus:border-indigo-600" required>
            <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg">Create Account</button>
        </form>
        <button onclick="googleLogin()" class="w-full mt-4 border-2 border-slate-100 py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-slate-50 transition">
            Continue with Google
        </button>
        <p class="mt-6 text-center text-slate-500 text-sm">Already have an account? <a href="login.html" class="text-indigo-600 font-bold underline">Login here</a></p>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
